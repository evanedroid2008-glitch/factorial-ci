name: CI — тести та збірка артефакту

# Workflow запускається на кожен push у будь-яку гілку, на pull request
# і вручну з вкладки Actions кнопкою «Run workflow».
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job 1: прогін тестів на трьох версіях Node.js одночасно (матриця).
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Smoke test CLI
        run: node src/cli.js 20

  # Job 2: виконується лише після успішного job test (needs).
  package:
    name: Package artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests once more before packaging
        run: npm test

      - name: Create source archive
        run: |
          mkdir -p dist
          zip -r dist/factorial-ci.zip . \
            -x 'node_modules/*' -x '.git/*' -x 'dist/*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: factorial-ci-source
          path: dist/factorial-ci.zip
          retention-days: 14
